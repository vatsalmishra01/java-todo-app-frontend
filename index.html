<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            line-height: 1.6;
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .section h2 {
            margin-top: 0;
            color: #333;
        }
        
        input, button {
            padding: 8px 12px;
            margin: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        
        button {
            background: #007bff;
            color: white;
            cursor: pointer;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .todo-item {
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #007bff;
            background: #f8f9fa;
        }
        
        .completed {
            border-left-color: #28a745;
            background: #d4edda;
        }
        
        .message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
        
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        
        .stats {
            background: #e9ecef;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <h1>Todo Management System</h1>
    
    <!-- Add Todo Section -->
    <div class="section">
        <h2>Add New Todo</h2>
        <input type="text" id="newTitle" placeholder="Enter todo title" style="width: 70%;">
        <label>
            <input type="checkbox" id="newCompleted"> Completed
        </label>
        <br>
        <button onclick="addTodo()">Add Todo</button>
    </div>
    
    <!-- Update Todo Section -->
    <div class="section">
        <h2>Update Todo</h2>
        <input type="number" id="updateId" placeholder="Todo ID" style="width: 100px;">
        <input type="text" id="updateTitle" placeholder="New title" style="width: 50%;">
        <label>
            <input type="checkbox" id="updateCompleted"> Completed
        </label>
        <br>
        <button onclick="updateTodo()">Update Todo</button>
    </div>
    
    <!-- Actions Section -->
    <div class="section">
        <h2>Actions</h2>
        <input type="number" id="searchId" placeholder="Todo ID" style="width: 100px;">
        <button onclick="getTodoById()">Get Todo by ID</button>
        <button onclick="deleteTodo()">Delete Todo</button>
        <button onclick="loadAllTodos()">Show All Todos</button>
    </div>
    
    <!-- Messages -->
    <div id="messages"></div>
    
    <!-- Todos Display -->
    <div class="section">
        <h2>Todos</h2>
        <div class="stats" id="stats">Total: 0 | Completed: 0 | Pending: 0</div>
        <div id="todosList">Loading...</div>
    </div>

    <script>
        const API_URL = 'http://localhost:9200/todos';
        
        // Initialize
        document.addEventListener('DOMContentLoaded', loadAllTodos);
        
        function showMessage(text, type = 'success') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            document.getElementById('messages').appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }
        
        async function addTodo() {
            const title = document.getElementById('newTitle').value.trim();
            const completed = document.getElementById('newCompleted').checked;
            
            if (!title) {
                showMessage('Title is required', 'error');
                return;
            }
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, completed })
                });
                
                if (response.ok) {
                    const todo = await response.json();
                    showMessage(`Todo created with ID: ${todo.id}`);
                    document.getElementById('newTitle').value = '';
                    document.getElementById('newCompleted').checked = false;
                    loadAllTodos();
                } else {
                    showMessage('Failed to create todo', 'error');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }
        
        async function updateTodo() {
            const id = document.getElementById('updateId').value;
            const title = document.getElementById('updateTitle').value.trim();
            const completed = document.getElementById('updateCompleted').checked;
            
            if (!id) {
                showMessage('ID is required', 'error');
                return;
            }
            if (!title) {
                showMessage('Title is required', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, completed })
                });
                
                const result = await response.text();
                
                if (result.startsWith('Error:')) {
                    showMessage(result, 'error');
                } else {
                    showMessage('Todo updated successfully');
                    document.getElementById('updateId').value = '';
                    document.getElementById('updateTitle').value = '';
                    document.getElementById('updateCompleted').checked = false;
                    loadAllTodos();
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }
        
        async function deleteTodo() {
            const id = document.getElementById('searchId').value;
            
            if (!id) {
                showMessage('ID is required', 'error');
                return;
            }
            
            if (!confirm(`Delete todo with ID ${id}?`)) return;
            
            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.text();
                showMessage(result, result.startsWith('Success:') ? 'success' : 'error');
                
                if (result.startsWith('Success:')) {
                    document.getElementById('searchId').value = '';
                    loadAllTodos();
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }
        
        async function getTodoById() {
            const id = document.getElementById('searchId').value;
            
            if (!id) {
                showMessage('ID is required', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const result = await response.text();
                
                if (result.startsWith('Error:')) {
                    showMessage(result, 'error');
                    document.getElementById('todosList').innerHTML = '<p>Todo not found</p>';
                } else {
                    const todo = JSON.parse(result);
                    displayTodos([todo]);
                    showMessage('Todo found');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }
        
        async function loadAllTodos() {
            try {
                const response = await fetch(API_URL);
                const todos = await response.json();
                displayTodos(todos);
                updateStats(todos);
            } catch (error) {
                showMessage('Failed to load todos: ' + error.message, 'error');
                document.getElementById('todosList').innerHTML = '<p>Failed to load todos</p>';
            }
        }
        
        function displayTodos(todos) {
            const container = document.getElementById('todosList');
            
            if (todos.length === 0) {
                container.innerHTML = '<p>No todos available</p>';
                return;
            }
            
            container.innerHTML = todos.map(todo => 
                `<div class="todo-item ${todo.completed ? 'completed' : ''}">
                    <strong>ID:</strong> ${todo.id}<br>
                    <strong>Title:</strong> ${todo.title}<br>
                    <strong>Status:</strong> ${todo.completed ? 'Completed' : 'Pending'}
                 </div>`
            ).join('');
        }
        
        function updateStats(todos) {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const pending = total - completed;
            
            document.getElementById('stats').textContent = 
                `Total: ${total} | Completed: ${completed} | Pending: ${pending}`;
        }
    </script>
</body>
</html>
